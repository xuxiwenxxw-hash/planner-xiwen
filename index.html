<title>Xiwen 每日清单</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout: one narrow planner column — module tabs (清单 / 记账), then time-ordered sections; 记账 is a month ledger with totals and category bars */
:root{
  --bg:#f5f6f9; --card:#ffffff; --ink:#17203a; --muted:#646c82; --line:#e1e4ec;
  --accent:#2f4fd6; --accent-ink:#ffffff; --hl:#fff1a8; --star:#d99a00;
  --warn:#c2410c; --warn-bg:#fff1e8; --good:#0f7a55;
  --c-study:#2f4fd6; --c-study-bg:#e8ecff;
  --c-work:#b45309; --c-work-bg:#fdf0dc;
  --c-life:#9d2f8c; --c-life-bg:#fbe7f6;
  --c-tag:#0f7a55; --c-tag-bg:#e2f5ec;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141d; --card:#1a1e2a; --ink:#e7e9f2; --muted:#9aa1b5; --line:#2b3142;
  --accent:#7d95ff; --accent-ink:#0e1220; --hl:#4a4318; --star:#f5c542;
  --warn:#ff9a62; --warn-bg:#3a2216; --good:#6fd6a8;
  --c-study:#9fb1ff; --c-study-bg:#232c52;
  --c-work:#f3b76b; --c-work-bg:#3a2a14;
  --c-life:#f0a1e2; --c-life-bg:#3b1d36;
  --c-tag:#6fd6a8; --c-tag-bg:#16362a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141d; --card:#1a1e2a; --ink:#e7e9f2; --muted:#9aa1b5; --line:#2b3142;
  --accent:#7d95ff; --accent-ink:#0e1220; --hl:#4a4318; --star:#f5c542;
  --warn:#ff9a62; --warn-bg:#3a2216; --good:#6fd6a8;
  --c-study:#9fb1ff; --c-study-bg:#232c52;
  --c-work:#f3b76b; --c-work-bg:#3a2a14;
  --c-life:#f0a1e2; --c-life-bg:#3b1d36;
  --c-tag:#6fd6a8; --c-tag-bg:#16362a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
h1{margin:0;font-size:26px;font-weight:700;text-wrap:balance}
h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 2px}
.modules{display:grid;grid-template-columns:1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.modules button{font:inherit;font-weight:500;border:0;border-radius:9px;padding:8px;background:none;color:var(--muted);cursor:pointer}
.modules button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}
.pill.warn{border-color:transparent;background:var(--warn-bg);color:var(--warn)}
.pill.warn b{color:var(--warn)}
form.add{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
form.add input,form.add select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
form.add button{font:inherit;font-weight:500;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
form.add label.mainchk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);grid-column:1/-1}
form.ledger-add{grid-template-columns:auto 1fr 1fr auto}
@media (max-width:560px){form.add{grid-template-columns:1fr 1fr}form.add .wide{grid-column:1/-1}form.add button{grid-column:1/-1}}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{display:flex;flex-direction:column;gap:8px}
section > h2,.h2{margin:0;font-size:14px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
section.overdue > h2{color:var(--warn)}
section.main{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
section.main > h2{color:var(--star)}
section.main li.task{background:var(--bg)}
.hint{font-size:12px;color:var(--muted);margin:0}
.daylabel{font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--f-mono)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li.task{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
section.overdue li.task{border-left:3px solid var(--warn)}
li.task.done .title{color:var(--muted);text-decoration:line-through}
.check{appearance:none;width:20px;height:20px;border:2px solid var(--muted);border-radius:6px;margin:2px 0 0;cursor:pointer;display:grid;place-content:center;background:var(--card)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.body{min-width:0;display:flex;flex-direction:column;gap:3px}
.title{overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chip{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:500}
.chip.学习{color:var(--c-study);background:var(--c-study-bg)}
.chip.工作{color:var(--c-work);background:var(--c-work-bg)}
.chip.私人{color:var(--c-life);background:var(--c-life-bg)}
.chip.tag{color:var(--c-tag);background:var(--c-tag-bg)}
.due{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.due.soon{color:var(--warn);font-weight:500}
.meta a{color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.icon-btn{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:6px;white-space:nowrap}
.icon-btn.star{font-size:16px;line-height:1}
.icon-btn.star.on{color:var(--star)}
.icon-btn.confirm{color:var(--warn);background:var(--warn-bg)}
details > summary{cursor:pointer;font-size:14px;font-weight:700;list-style:none;display:flex;gap:8px;align-items:baseline}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"▸";color:var(--muted)}
details[open] > summary::before{content:"▾"}
details > ul{margin-top:8px}
.state{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted);text-align:center}
.footer{font-size:12px;color:var(--muted)}
/* ledger */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthbar button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:4px 12px;cursor:pointer}
.monthbar strong{font-size:18px}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tot span{font-size:12px;color:var(--muted)}

    <h3 id="dlg-title">完成了吗？</h3>
    <p id="dlg-msg"></p>
    <div class="dlg-btns"><button type="button" id="dlg-no">还没</button><button type="button" id="dlg-ok">确定完成 ✓</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s);
const WEEK=['周日','周一','周二','周三','周四','周五','周六'];
let tasks=[],col=null,ledger=null,entries=[],pendingDel=null,pendingDelL=null;
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
const now=new Date(),todayStr=ymd(now);
const wkStart=(()=>{const d=new Date(now);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)})();
const wkEnd=(()=>{const d=parse(wkStart);d.setDate(d.getDate()+6);return ymd(d)})();
function diffDays(s){return Math.round((parse(s)-parse(todayStr))/86400000)}
function fmtDay(s){const d=parse(s);return(d.getMonth()+1)+'月'+d.getDate()+'日 '+WEEK[d.getDay()]}
function rel(s){const n=diffDays(s);if(n===0)return'今天';if(n===1)return'明天';if(n===-1)return'昨天';if(n<0)return'过了'+(-n)+'天';return'还有'+n+'天'}
const BRANCHES=[
  {k:'课程',e:'📚',d:'UCSB 四门课'},
  {k:'转学',e:'🏫',d:'转学申请'},
  {k:'实习',e:'💼',d:'Marc · The Amazing Group'},
  {k:'DBC求职',e:'🎯',d:'顾问 Zoe 的 tracker'},
  {k:'LGBTQ实习',e:'🌈',d:'学校 RCSGD'},
  {k:'私人',e:'🍓',d:'生活 & 自己的事'}];
const BI=Object.fromEntries(BRANCHES.map((b,i)=>[b.k,i]));
function catOf(t){
  if(t.branch&&t.branch in BI)return t.branch;
  if(t.cat in BI)return t.cat;
  if(t.cat==='学习')return'课程';
  if(t.tag==='求职'||t.cat==='实习申请')return'DBC求职';
  if(t.tag==='实习'||t.cat==='实习工作'||t.cat==='工作')return'实习';
  return'私人';
}
$('#today-h').innerHTML='今天是 <mark>'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+WEEK[now.getDay()]+'</mark>';
function el(tag,attrs={},kids=[]){const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else e.setAttribute(k,v)}for(const c of[].concat(kids))if(c)e.append(c);return e}
function showErr(where,m){const s=el('div',{class:'state',text:m});$(where).prepend(s);setTimeout(()=>s.remove(),4000)}

/* ---------- pages ---------- */
let view='today',loaded=false;
const PAGES=[{k:'today',e:'📅',n:'今天'}].concat(BRANCHES.map(b=>({k:b.k,e:b.e,n:b.k}))).concat([{k:'money',e:'💰',n:'记账'}]);
function buildNav(){const nav=$('#nav');nav.textContent='';PAGES.forEach(p=>{const b=el('button',{type:'button','aria-current':view===p.k?'page':'false'},[el('span',{class:'ne',text:p.e}),el('span',{text:p.n})]);b.addEventListener('click',()=>setView(p.k));nav.append(b)})}
const SLUG={today:'today','课程':'courses','转学':'transfer','实习':'intern','DBC求职':'dbc','LGBTQ实习':'lgbtq','私人':'life',money:'money'};
const UNSLUG=Object.fromEntries(Object.entries(SLUG).map(([k,v])=>[v,k]));
function setView(v,fromHash){if(!PAGES.some(p=>p.k===v))v='today';const prev=view;view=v;try{localStorage.setItem('view',v)}catch(e){}
  const detail=v in BI;
  document.body.classList.toggle('detail',detail);
  $('#topbar').hidden=!detail;$('#main-head').hidden=detail;$('#nav').hidden=detail;
  if(detail){const br=BRANCHES[BI[v]];$('#tb-title').textContent=br.e+' '+br.k;$('#topbar').className='topbar b'+BI[v]}
  $('#todo').hidden=v==='money';$('#money').hidden=v!=='money';
  if(detail)$('#t-cat').value=v;else $('#t-cat').value='课程';
  buildNav();if(v!=='money')render();else renderMoney();
  const pane=v==='money'?$('#money'):$('#todo');
  pane.classList.remove('enter','enter-back');void pane.offsetWidth;pane.classList.add(detail?'enter':(prev in BI?'enter-back':'enter-fade'));
  if(!fromHash){try{if(location.hash.slice(1)!==SLUG[v])location.hash=SLUG[v]}catch(e){}}
  try{window.scrollTo({top:0})}catch(e){}}
window.addEventListener('hashchange',()=>{const k=UNSLUG[location.hash.slice(1)]||'today';if(k!==view)setView(k,true)});

/* ---------- todo ---------- */
function row(t){
  const c=catOf(t);
  const li=el('li',{class:'task'+(t.done?' done':'')});
  const cb=el('input',{type:'checkbox',class:'check',id:'c-'+t.id,'aria-label':'完成：'+t.title});cb.checked=!!t.done;
  cb.addEventListener('click',e=>{e.preventDefault();
    if(!t.done)ask('🎀 完成了吗？','确定你已经完成「'+t.title+'」了吗？','确定完成 ✓','还没',()=>{patch(t,{done:true,doneAt:todayStr});celebrate(t)});
    else ask('撤回完成？','要把「'+t.title+'」改回「还没做完」吗？','改回没做完','不用',()=>patch(t,{done:false,doneAt:null}));
  });
  const meta=el('div',{class:'meta'},[el('span',{class:'chip b'+(BI[c]??5),text:(BRANCHES[BI[c]??5].e)+' '+c})]);
  if(t.date){const n=diffDays(t.date);meta.append(el('span',{class:'due'+(!t.done&&n<=2?' soon':''),text:fmtDay(t.date)+' · '+rel(t.date)}))}
  else meta.append(el('span',{class:'due',text:'随时可做'}));
  if(t.link)meta.append(el('a',{href:t.link,target:'_blank',rel:'noopener',text:'打开链接'}));
  const body=el('div',{class:'body'},[el('span',{class:'title',text:t.title}),meta]);
  if(t.note)body.append(el('span',{class:'note',text:t.note}));
  const star=el('button',{type:'button',class:'icon-btn star'+(t.main?' on':''),'aria-label':(t.main?'取消主线：':'设为本周主线：')+t.title,'aria-pressed':String(!!t.main),text:t.main?'★':'☆'});
  star.addEventListener('click',()=>patch(t,{main:!t.main}));
  const del=el('button',{type:'button',class:'icon-btn','aria-label':'删除 '+t.title,text:'删除'});
  del.addEventListener('click',()=>ask('删除这件事？','确定要删除「'+t.title+'」吗？删掉就找不回来了。如果是做完了，请点左边的 ♡ 打勾。','确定删除','不删了',()=>removeTask(t),true));
  li.append(cb,body,star,del);return li;
}
function section(title,list,cls,byDay,hint){
  if(!list.length&&!hint)return null;
  const s=el('section',{class:cls||''},[el('h2',{},[document.createTextNode(title),el('span',{class:'n',text:String(list.length)})])]);
  if(!list.length){s.append(el('p',{class:'hint',text:hint}));return s}
  if(byDay){let cur,ul;for(const t of list){if(t.date!==cur){cur=t.date;s.append(el('div',{class:'daylabel',text:fmtDay(t.date)+' · '+rel(t.date)}));ul=el('ul');s.append(ul)}ul.append(row(t))}}
  else{const ul=el('ul');list.forEach(t=>ul.append(row(t)));s.append(ul)}
  return s;
}
function folded(title,list,open){
  if(!list.length)return null;
  const d=el('details');if(open)d.open=true;
  d.append(el('summary',{},[document.createTextNode(title),el('span',{class:'n',text:String(list.length)})]));
  const ul=el('ul');list.forEach(t=>ul.append(row(t)));d.append(ul);return d;
}
function progBar(label,done,tot,cls){const pct=tot?Math.round(done/tot*100):0;
  return el('div',{class:'qprog'},[el('div',{class:'pbar '+(cls||''),role:'progressbar','aria-label':label,'aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(pct)},[el('div',{class:'pfill',style:'width:'+pct+'%'})]),el('span',{class:'qpct',text:tot?(done===tot?'通关 🏆':done+'/'+tot+' · '+pct+'%'):'—'})])}
function render(){
  const board=$('#board');board.textContent='';
  const isToday=view==='today';
  const vis=isToday?tasks:tasks.filter(t=>catOf(t)===view);
  const byDate=(a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.title||'').localeCompare(b.title||'');
  const undone=vis.filter(t=>!t.done).sort(byDate);
  const mainWk=vis.filter(t=>t.main&&(!t.done||(t.doneAt&&t.doneAt>=wkStart))).sort((a,b)=>(a.done-b.done)||byDate(a,b));
  const rest=undone.filter(t=>!t.main);
  const overdue=rest.filter(t=>t.date&&t.date<todayStr);
  const today=rest.filter(t=>t.date===todayStr);
  const tomorrow=rest.filter(t=>t.date&&diffDays(t.date)===1);
  const soon=rest.filter(t=>t.date&&t.date>todayStr&&diffDays(t.date)<=14);
  const later=rest.filter(t=>t.date&&diffDays(t.date)>14);
  const anytime=rest.filter(t=>!t.date).sort((a,b)=>(a.order??999)-(b.order??999));
  const done=vis.filter(t=>t.done&&!(t.main&&t.doneAt>=wkStart)).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  // summary
  const sm=$('#summary');sm.textContent='';
  const p=(l,n,w)=>{const e=el('span',{class:'pill'+(w?' warn':'')});e.append(document.createTextNode(l+' '),el('b',{text:String(n)}));sm.append(e)};
  p('✅ 已完成',vis.filter(t=>t.done).length);p('⏳ 还剩',undone.length);
  p('⭐ 本周必做还剩',mainWk.filter(t=>!t.done).length);
  if(overdue.length)p('过期没做完',overdue.length,true);
  // page hero
  const hero=$('#hero');hero.textContent='';
  if(isToday){hero.append(el('h2',{class:'ph',text:'📅 今天要做的'}),el('p',{class:'pd',text:'本周必做、过期没做完的、今天和明天的事都在这一页。其他的去上面各条主线看。'}))}
  else{const br=BRANCHES[BI[view]];const all=vis,dn=all.filter(t=>t.done).length;
    hero.className='hero b'+BI[view];
    hero.append(el('h2',{class:'ph',text:br.e+' '+br.k+' 主线'}),el('p',{class:'pd',text:br.d}),progBar(br.k+' 进度',dn,all.length,'big'))}
  if(isToday)hero.className='hero';
  if(!loaded){board.append(el('div',{class:'state',text:'正在加载你的清单…'}));renderXP();return}
  const g=el('div',{style:'display:flex;flex-direction:column;gap:22px'});
  const mainSec=section((isToday?'本周必做':'本周必做 · '+view)+'（'+fmtDay(wkStart).split(' ')[0]+'–'+fmtDay(wkEnd).split(' ')[0]+'）',mainWk,'main',false,'还没有本周必做。点任意一件事右边的 ☆ 把它设为本周必做。');
  if(mainWk.length)mainSec.insertBefore(progBar('本周必做进度',mainWk.filter(t=>t.done).length,mainWk.length,'big gold'),mainSec.children[1]);
  let parts;
  if(isToday){
    parts=[mainSec,section('⚠️ 之前没做完的',overdue,'overdue'),section('今天要做',today,'',false,'今天没有到期的事 🎉 可以从各条主线里挑一件先做。'),section('明天',tomorrow)];
  }else{
    parts=[mainSec,section('⚠️ 之前没做完的',overdue,'overdue'),section('今天要做',today),section('接下来两周',soon.filter(t=>t.date!==todayStr),'',true),
      folded('两周以后',later,true),folded('随时可做 / 随时可投',anytime,true),folded('已完成',done,false)];
    if(!vis.length)parts.push(el('div',{class:'state',text:'这条主线还没有任务。在上面加第一件事吧 ✿'}));
  }
  parts.filter(Boolean).forEach(x=>g.append(x));
  if(isToday){const qs=el('section',{},[el('h2',{text:'🎮 各条主线进度'})]);const q=el('div',{class:'quests'});qs.append(q);renderQuests(q);g.append(qs)}
  board.append(g);renderXP();
}
function renderQuests(q){
  BRANCHES.forEach((br,i)=>{
    const all=tasks.filter(t=>catOf(t)===br.k),dn=all.filter(t=>t.done).length,tot=all.length,left=tot-dn;
    const nx=all.filter(t=>!t.done&&t.date&&t.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date))[0];
    const next=nx?(Number(nx.date.slice(5,7))+'/'+Number(nx.date.slice(8))):null;
    const pct=tot?Math.round(dn/tot*100):0;
    const b=el('button',{type:'button',class:'quest b'+i+(tot&&!left?' clear':''),'aria-label':'打开 '+br.k+' 主线'});
    b.append(el('span',{class:'go','aria-hidden':'true',text:'›'}),el('span',{class:'qe',text:br.e}),el('span',{class:'qn',text:br.k}),el('span',{class:'qd',text:br.d}),
      el('div',{class:'qprog'},[el('div',{class:'pbar',role:'progressbar','aria-label':br.k+' 进度','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(pct)},[el('div',{class:'pfill',style:'width:'+pct+'%'})]),el('span',{class:'qpct',text:tot?pct+'%':'—'})]),
      el('span',{class:'ql',text:!tot?'还没有任务':!left?'🏆 主线通关！':(dn+'/'+tot+' · 还剩 '+left+(next?' · 下一件 '+next:''))}));
    b.addEventListener('click',()=>setView(br.k));q.append(b);
  });
}
function renderXP(){
  const xp=tasks.filter(t=>t.done).reduce((s,t)=>s+(t.main?30:10),0);
  const per=50,lv=Math.floor(xp/per)+1,cur=xp%per;
  $('#xp-lv').textContent='Lv.'+lv;$('#xp-num').textContent=cur+' / '+per+' XP · 总 '+xp;
  $('#xp-bar').style.width=(cur/per*100)+'%';$('#xp-bar-wrap').setAttribute('aria-valuenow',String(Math.round(cur/per*100)));
}
/* confirm dialog + celebration toast */
let askCb=null;
function ask(title,msg,okText,noText,onOk,danger){
  $('#dlg-title').textContent=title;$('#dlg-msg').textContent=msg;
  const ok=$('#dlg-ok');ok.textContent=okText;ok.classList.toggle('danger',!!danger);$('#dlg-no').textContent=noText;
  askCb=onOk;$('#dlg').hidden=false;ok.focus();
}
function closeAsk(){$('#dlg').hidden=true;askCb=null}
$('#dlg-ok').addEventListener('click',()=>{const f=askCb;closeAsk();if(f)f()});
$('#dlg-no').addEventListener('click',closeAsk);
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeAsk()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dlg').hidden)closeAsk()});
let toastT=null;
function celebrate(t){
  const done=tasks.filter(x=>x.done).length,left=tasks.filter(x=>!x.done).length;
  const tt=$('#toast');tt.textContent='';
  tt.append(el('b',{text:'🎉 完成！+'+(t.main?30:10)+' XP'}),el('span',{text:'已经做了 '+done+' 件 · 还剩 '+left+' 件没做'}));
  tt.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>tt.hidden=true,3200);
}
async function patch(t,fields){
  const old={};for(const k in fields)old[k]=t[k];
  Object.assign(t,fields);render();
  if(!col)return;
  try{await col.doc(t.id).update(fields)}catch(e){Object.assign(t,old);render();showErr('#board','没保存上，请再点一次。')}
}
async function removeTask(t){pendingDel=null;tasks=tasks.filter(x=>x.id!==t.id);render();if(col)try{await col.doc(t.id).delete()}catch(e){showErr('#board','没删掉，请刷新后再试。')}}
$('#add-form').addEventListener('submit',async e=>{
  e.preventDefault();const title=$('#t-title').value.trim();if(!title)return;
  const data={title,date:$('#t-date').value||null,branch:$('#t-cat').value,cat:$('#t-cat').value,main:$('#t-main').checked,done:false,doneAt:null,added:todayStr};
  $('#t-title').value='';$('#t-date').value='';$('#t-main').checked=false;
  if(!col){tasks.push(Object.assign({id:'local-'+Date.now()},data));render();showErr('#board','现在连不上存储，这条只在这次打开时有效。');return}
  const ref=col.doc();const t=Object.assign({id:ref.id},data);tasks.push(t);render();
  try{await ref.set(data)}catch(err){tasks=tasks.filter(x=>x!==t);render();showErr('#board','没加上，请再试一次。')}
});

/* ---------- money ---------- */
let viewMonth=todayStr.slice(0,7);
$('#l-date').value=todayStr;
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function shiftMonth(k){const[y,m]=viewMonth.split('-').map(Number);const d=new Date(y,m-1+k,1);viewMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderMoney()}
$('#mprev').onclick=()=>shiftMonth(-1);$('#mnext').onclick=()=>shiftMonth(1);
function renderMoney(){
  const[y,m]=viewMonth.split('-');$('#mlabel').textContent=y+'年'+Number(m)+'月';
  const list=entries.filter(e=>(e.date||'').startsWith(viewMonth)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let out=0,inc=0;const byCat={};
  for(const e of list){const a=Number(e.amount)||0;if(e.type==='收入')inc+=a;else{out+=a;byCat[e.cat]=(byCat[e.cat]||0)+a}}
  $('#tot-out').textContent=money(out);$('#tot-in').textContent=money(inc);$('#tot-bal').textContent=money(inc-out);
  const bars=$('#l-bars');bars.textContent='';
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(cats.length){const box=el('div',{class:'bars'},[el('div',{class:'h2',text:'这个月钱花在哪'})]);const max=cats[0][1];
    for(const[c,a]of cats){const fill=el('div',{class:'fill',style:'width:'+Math.max(3,a/max*100).toFixed(1)+'%'});box.append(el('div',{class:'bar'},[el('span',{text:c}),el('div',{class:'track'},[fill]),el('span',{class:'amt',text:money(a)})]))}
    bars.append(box)}
  const L=$('#l-list');L.textContent='';
  if(!ledger){L.append(el('div',{class:'state',text:'存储打不开了，请检查浏览器设置。'}));return}
  if(!list.length){L.append(el('div',{class:'state',text:'这个月还没有记账。在上面填金额，点「记一笔」。'}));return}
  const ul=el('ul');
  for(const e of list){
    const isIn=e.type==='收入';
    const del=el('button',{type:'button',class:'icon-btn','aria-label':'删除这笔',text:pendingDelL===e.id?'确认？':'删除'});
    if(pendingDelL===e.id)del.classList.add('confirm');
    del.onclick=async()=>{if(pendingDelL!==e.id){pendingDelL=e.id;renderMoney();return}pendingDelL=null;entries=entries.filter(x=>x.id!==e.id);renderMoney();try{await ledger.doc(e.id).delete()}catch(err){showErr('#l-list','没删掉，请刷新后再试。')}};
    ul.append(el('li',{class:'entry'},[el('span',{class:'d',text:e.date.slice(5).replace('-','/')}),el('div',{class:'body'},[el('span',{class:'title',text:e.note||e.cat}),el('span',{class:'note',text:(isIn?'收入':'支出')+' · '+e.cat})]),el('span',{class:'amt '+(isIn?'in':'out'),text:(isIn?'+':'-')+money(Number(e.amount)||0)}),del]))
  }
  L.append(ul);
}
$('#l-type').addEventListener('change',()=>{const s=$('#l-cat');const inc=$('#l-type').value==='收入';s.innerHTML='';(inc?['工资','家里给的','奖学金','退款','其他']:['餐饮','咖啡奶茶','交通','购物','房租水电','学习','娱乐','生活用品','其他']).forEach(o=>s.append(el('option',{text:o})))});
$('#l-form').addEventListener('submit',async e=>{
  e.preventDefault();const amt=parseFloat($('#l-amt').value);if(!(amt>0))return;
  const data={type:$('#l-type').value,amount:Math.round(amt*100)/100,cat:$('#l-cat').value,date:$('#l-date').value||todayStr,note:$('#l-note').value.trim(),added:todayStr};
  $('#l-amt').value='';$('#l-note').value='';
  if(!ledger){showErr('#l-list','现在连不上存储，没能保存。');return}
  const ref=ledger.doc();const item=Object.assign({id:ref.id},data);entries.push(item);viewMonth=data.date.slice(0,7);renderMoney();
  try{await ref.set(data)}catch(err){entries=entries.filter(x=>x!==item);renderMoney();showErr('#l-list','没记上，请再试一次。')}
});
renderMoney();

let v0=UNSLUG[location.hash.slice(1)];if(!v0){v0='today';try{const s=localStorage.getItem('view');if(s==='money')v0='money'}catch(e){}}
setView(v0,true);
$('#back').addEventListener('click',()=>{if(history.length>1&&location.hash&&document.referrer!==''){}setView('today')});
/* ---------- boot ---------- */
(async()=>{
  const timer=setTimeout(()=>{const s=$('#state');if(s)s.textContent='暂时连不上你的清单，稍等一下或刷新页面。'},10000);
  let db=null;try{db=await window.claude?.use?.('db')}catch(e){}
  if(!db){clearTimeout(timer);$('#board').textContent='';$('#board').append(el('div',{class:'state',text:'存储打不开了，请检查浏览器是否关闭了网站数据。'}));renderMoney();return}
  col=db.collection('tasks');ledger=db.collection('ledger');
  col.onSnapshot(snap=>{tasks=snap.docs.map(d=>Object.assign({id:d.id},d.data()));loaded=true;if(!snap.metadata.fromCache)clearTimeout(timer);render()},()=>{clearTimeout(timer);showErr('#board','清单加载出错了，请刷新页面。')});
  ledger.onSnapshot(snap=>{entries=snap.docs.map(d=>Object.assign({id:d.id},d.data()));renderMoney()},()=>showErr('#l-list','账目加载出错了，请刷新页面。'));
})();
</script>
